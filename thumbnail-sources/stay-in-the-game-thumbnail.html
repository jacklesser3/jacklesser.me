<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stay in the Game Thumbnail</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');

    :root {
      --orange: #bf5700;   /* the color owns the frame */
      --cream: #faf3e8;
      --espresso: #2a1608;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: var(--orange);
      font-family: 'Inter', Arial, sans-serif;
    }

    .canvas {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 64px 72px;
    }

    .headline {
      position: absolute;
      left: 72px;
      top: 44px;
      color: var(--cream);
      font-size: 196px;
      font-weight: 900;
      line-height: 0.93;
      letter-spacing: -0.045em;
    }

    .headline .period {
      color: var(--espresso);
    }

    .kicker {
      position: absolute;
      left: 72px;
      bottom: 64px;
      color: var(--cream);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.92;
    }

    .kicker .dim {
      opacity: 0.55;
      font-weight: 400;
    }

    .site {
      position: absolute;
      right: 72px;
      bottom: 64px;
      color: var(--espresso);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="headline">
      Stay<br />in the<br />Game<span class="period">.</span>
    </div>

    <div class="kicker">Make Your Bed <span class="dim">&middot; A Timeless Reflection</span></div>

    <div class="site">jacklesser.me</div>
  </div>
</body>
</html>
